<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Your personal starting point for YouTube, Netflix, Disney+, HBO and Amazon Prime.">
  <title>Media — Your streaming starts here</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c2432'/%3E%3Cpath d='M12 9L23 16 12 23Z' fill='white'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #1c2432; background: #fff; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    header, main, footer { width: min(1160px, calc(100% - 112px)); margin-inline: auto; }
    header { padding-block: 42px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 23px; font-weight: 700; letter-spacing: -.8px; }
    .brand svg { width: 34px; height: 34px; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 56px 100px; }
    .eyebrow { margin: 0 0 15px; color: #747b85; font-size: 12px; font-weight: 650; letter-spacing: 2.2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 4vw, 48px); line-height: 1.15; font-weight: 600; letter-spacing: -1.8px; }
    .intro { margin: 16px 0 44px; color: #737985; font-size: 17px; line-height: 1.6; }
    .services { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; }
    .service { color: inherit; text-decoration: none; border-radius: 19px; outline-offset: 7px; }
    .tile { height: 190px; border-radius: 16px; display: flex; align-items: center; justify-content: center; transition: transform .18s ease, box-shadow .18s ease; }
    .service:hover .tile { transform: translateY(-5px); box-shadow: 0 8px 16px #1c24320a; }
    .service:focus-visible { outline: 3px solid #2864e8; }
    .service:focus-visible .tile { transform: translateY(-5px); }
    .tile img { width: 98px; height: 98px; object-fit: contain; }
    .youtube .tile { background: #fff0ef; }
    .youtube img { filter: invert(21%) sepia(97%) saturate(6699%) hue-rotate(356deg) brightness(101%) contrast(124%); width: 77px; }
    .netflix .tile { background: #f8f0f1; }
    .netflix img { width: 60px; height: 83px; filter: invert(15%) sepia(98%) saturate(6099%) hue-rotate(344deg) brightness(86%) contrast(115%); }
    .disney .tile { background: #edf5f7; }
    .disney img { width: 133px; height: 90px; filter: brightness(0) saturate(100%); }
    .hbo .tile { background: #f2f0f8; gap: 7px; }
    .hbo img { width: 87px; height: 65px; }
    .go { font-size: 26px; font-weight: 300; color: #111; letter-spacing: -1.4px; }
    .prime .tile { background: #edf5fc; }
    .prime img { width: 121px; height: 94px; filter: invert(42%) sepia(96%) saturate(1261%) hue-rotate(166deg) brightness(93%) contrast(102%); }
    .label { margin: 19px 3px 0; display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; line-height: 1.5; }
    .arrow { color: #8a909a; font-size: 19px; font-weight: 400; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 25px 30px; border-top: 1px solid #eef0f3; color: #858b95; font-size: 13px; line-height: 1.7; }
    footer p { margin: 0; }
    kbd { font: inherit; font-size: 12px; color: #6d7480; border: 1px solid #e1e4e9; border-radius: 4px; padding: 2px 5px; margin-inline: 2px; }
    @media (min-width: 1600px) { header, main, footer { width: min(1440px, calc(100% - 160px)); } .tile { height: 240px; } .label { font-size: 20px; } .tile img { transform: scale(1.2); } }
    @media (max-width: 1000px) { header, main, footer { width: calc(100% - 64px); } .services { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 20px; } main { padding-block: 30px 64px; } .tile { height: 170px; } }
    @media (max-width: 600px) { header, main, footer { width: calc(100% - 40px); } header { padding-block: 26px; } main { padding-block: 28px 48px; } h1 { letter-spacing: -1px; } .intro { margin-bottom: 30px; font-size: 16px; } .services { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 16px; } .tile { height: 145px; } .label { font-size: 15px; margin-top: 13px; } .disney img { width: 110px; } .hbo img { width: 70px; } .go { font-size: 22px; } .prime img { width: 105px; } footer { align-items: flex-start; flex-direction: column; gap: 8px; } }
    @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
    @media (hover: none) { .keyboard-hint { display: none; } }
  </style>
</head>

  <footer><p>Good things are worth watching.</p><p class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd> to browse <span aria-hidden="true">&nbsp; · &nbsp;</span><kbd>Enter</kbd> to open</p></footer>
  <script>
    const links = [...document.querySelectorAll('.service')];
    document.addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key) || event.altKey || event.ctrlKey || event.metaKey) return;
      event.preventDefault();
      const index = links.indexOf(document.activeElement);
      if (index < 0) { links[0].focus(); return; }
      const columns = getComputedStyle(document.querySelector('.services')).gridTemplateColumns.split(' ').length;
      const offset = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns, ArrowDown: columns }[event.key];
      links[Math.max(0, Math.min(links.length - 1, index + offset))].focus();
    });
  </script>
